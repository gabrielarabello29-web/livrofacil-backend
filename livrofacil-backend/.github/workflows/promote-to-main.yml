name: Criar PR para Main

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    name: Criar Pull Request para Main
    runs-on: ubuntu-latest

    steps:
      - name: Criar PR develop → main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head develop \
            --title "Promover develop para main" \
            --body "PR criado automaticamente após atualização da branch develop." \
            || echo "Já existe um PR aberto de develop para main."